<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gentle Kitchen</title>
  <meta name="description" content="Gentle, low-residue vegetarian recipe ideas.">
  <meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gentle Kitchen">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand" id="page-title">Gentle Kitchen</h1>
    <div class="mode" role="group" aria-label="How are you feeling today?">
      <button type="button" data-mode="flare" aria-pressed="false">Flare day</button>
      <button type="button" data-mode="good" aria-pressed="true">Good day</button>
    </div>
  </header>

  <main id="app" tabindex="-1"><p class="loading" data-loading>Loading recipes…</p></main>

  <nav class="tabs" aria-label="Sections">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg><span>Recipes</span></a>
    <a href="#/plan" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Plan</span></a>
    <a href="#/shopping" data-tab="shopping"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14l-1.5 12a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1zM9 7a3 3 0 0 1 6 0"/></svg><span>Shopping<b class="badge" id="shop-count" hidden></b></span></a>
    <a href="#/saved" data-tab="saved"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span>Saved</span></a>
    <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"/></svg><span>My foods</span></a>
  </nav>

  <div class="timer-bar" id="timer-bar" role="timer" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="visually-hidden" id="sr-live" aria-live="assertive"></div>
  <script src="/js/check.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
